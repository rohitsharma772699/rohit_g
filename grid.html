<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
<style>
    .container {
      display: grid;
      grid-template-columns: 100px 200px 100px;
      gap: 20px;
    }
    .item {
      background-color: rgb(27, 193, 249);
      padding: 20px;
      text-align: center;
      justify-content: center;
      font-size: 18px;
      border: 1px solid #888888;
      border-radius: 8px;
    }
</style>
<div class="container">
  <div class="item" role="button" tabindex="0">Item 1</div>
  <div class="item" role="button" tabindex="0">Item 2</div>
  <div class="item" role="button" tabindex="0">Item 3</div>
  <div class="item" role="button" tabindex="0">Item 4</div>
  <div class="item" role="button" tabindex="0">Item 5</div>
  <div class="item" role="button" tabindex="0">Item 6</div>
</div>
</body>
</html>
