<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter R</title>

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background: linear-gradient(135deg, #f4680b, #f87e20, #f4aa0a, #bef90e, #87f90e, #05eab5, #08caf5, #0ca5f7);
}

.container{
    display:grid;
    grid-template-columns:repeat(5,50px);
    gap:5px;
}

.box{
    width:50px;
    height:50px;
    background: linear-gradient(135deg, #0f0f11, #5b605f);
    border-radius:5px;
}

.empty{
    visibility:hidden;
}
</style>
</head>
<body>

<div class="container">

    <!-- Row 1 -->
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="empty"></div>

    <!-- Row 2 -->
    <div class="box"></div>
    <div class="empty"></div>
    <div class="empty"></div>
    <div class="box"></div>
    <div class="empty"></div>

    <!-- Row 3 -->
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="empty"></div>

    <!-- Row 4 -->
    <div class="box"></div>
    <div class="empty"></div>
    <div class="box"></div>
    <div class="empty"></div>
    <div class="empty"></div>

    <!-- Row 5 -->
    <div class="box"></div>
    <div class="empty"></div>
    <div class="empty"></div>
    <div class="box"></div>
    <div class="empty"></div>

    <div class="box"></div>
    <div class="empty"></div>
    <div class="empty"></div>
    <div class="empty"></div>
    <div class="box"></div>

</div>

</body>
</html>
