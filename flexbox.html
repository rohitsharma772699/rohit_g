<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Flexbox Navbar</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #131921;
      color: #fff;
      padding: 10px 20px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .navbar-left,
    .navbar-center,
    .navbar-right {
      display: flex;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      color: #fff;
      text-decoration: none;
      font-size: 24px;
      font-weight: 700;
    }

    .logo span {
      color: #ff9900;
      margin-left: 4px;
      font-size: 28px;
    }

    .search {
      display: flex;
      flex: 1;
      max-width: 640px;
      min-width: 240px;
    }

    .search input {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 4px 0 0 4px;
      outline: none;
      font-size: 14px;
    }

    .search button {
      padding: 10px 16px;
      border: none;
      background: #febd69;
      color: #111;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      margin-left: 20px;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      line-height: 1.2;
    }

    .nav-item span:last-child {
      font-size: 14px;
      font-weight: 700;
    }

    .nav-link {
      display: flex;
      align-items: center;
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      font-weight: 700;
    }

    .cart {
      display: flex;
      align-items: center;
      margin-left: 20px;
    }

    .cart-count {
      margin-left: 8px;
      font-weight: 700;
    }

    @media (max-width: 860px) {
      .navbar {
        justify-content: center;
      }

      .search {
        width: 100%;
        max-width: 100%;
      }

      .navbar-right {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .nav-item,
      .nav-link,
      .cart {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar-left">
      <a href="#" class="logo">Amazon<span>.</span></a>
    </div>
    <div class="navbar-center">
      <div class="search">
        <input type="text" placeholder="Search Amazon" aria-label="Search Amazon">
        <button type="button">Search</button>
      </div>
    </div>
    <div class="navbar-right">
      <a class="nav-item" href="#">
        <span>Hello, Sign in</span>
        <span>Account & Lists</span>
      </a>
      <a class="nav-item" href="#">
        <span>Returns</span>
        <span>& Orders</span>
      </a>
      <a class="nav-link" href="#">Try Prime</a>
      <a class="nav-link cart" href="#">
        <span>Cart</span>
        <span class="cart-count">(0)</span>
      </a>
    </div>
  </header>
</body>
</html>
