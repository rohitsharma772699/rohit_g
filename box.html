<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP Image</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background-color:rgb(220,220,220);
        }

        .image{uu
            width:520px;
            height:520px;
            border-radius:50%;
            border:5px solid black;
            overflow:hidden;
        }

        .image img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

    </style>
</head>
<body>

    <div class="image">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSxSIc9Q3NpeeNDplpQ8k2f8WcfCm2nkExyw&s">
    </div>

</body>
</html>
