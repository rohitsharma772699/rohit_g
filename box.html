<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout</title>
<style>
.block{
    background-color: rgb(126,39,39);
    height:100px;
    width:1200px;
    margin:10px;
    border:5px solid rgb(224,90,69);
}
.box{
    background-color: rgb(122,56,2);
    height:100px;
    width:1200px;
    margin:10px;
    border:5px solid rgb(225,198,0);
}
.container{
    display:flex;
    gap:10px;
    margin:10px;
}
.boxheight{
    background-color: rgb(27,149,249);
    height:600px;
    width:400px;
    border:5px solid rgb(14,215,251);
}
.box1{
    background-color: rgb(36, 170, 247);
    height:600px;
    width:400px;
    border:5px solid rgb(25, 36, 255);
}
.box2{
    background-color: rgb(8, 178, 16);
    height:600px    ;
    width:400px;
    border:5px solid rgb(107, 248, 6);
}
.block{
    background-color: rgb(126,39,39);
    height:100px;
    width:1200px;
    margin:10px;
    border:5px solid rgb(224,90,69);
}
</style>
</head>
<body>
<div class="block"></div>
<div class="box"></div>
<div class="container">
    <div class="boxheight"></div>
    <div class="box1"></div>
    <div class="box2"></div>
</div>
<div class="block"></div>
</body>
</html>
