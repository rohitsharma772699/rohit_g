<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{height:100vh;display:flex;justify-content:center;align-items:center;background:#f4f4f4;font-family:system-ui,Segoe UI,Roboto,Arial}
    .container{width:90%;height:90vh;display:grid;grid-template-columns:220px 1fr 1fr 1fr;grid-template-rows:80px 150px 1fr 150px;gap:12px;padding:12px}
    .sidebar{grid-row:1 / 5;grid-column:1 / 2;background:#0000ff;border-radius:8px;border:2px solid rgba(0,0,0,.12);display:flex;justify-content:center;align-items:center;font-weight:600}
    .navbar{grid-column:2 / 5;grid-row:1 / 2;background:#219ebc;border-radius:8px;border:2px solid rgba(0,0,0,.12);display:flex;justify-content:center;align-items:center;color:#fff;font-weight:600}
    .box{background:#fb8500;border-radius:8px;border:2px solid rgba(0,0,0,.12);display:flex;justify-content:center;align-items:center;font-weight:600;color:#fff}
    .box1{grid-column:2 / 3;grid-row:2 / 3;background:#e63946}
    .box2{grid-column:3 / 4;grid-row:2 / 3;background:#2a9d8f}
    .box7{grid-column:4 / 5;grid-row:2 / 3;background:#6a4c93}
    .content{grid-column:2 / 4;grid-row:3 / 4;background:#800080;border-radius:8px;border:2px solid rgba(0,0,0,.12);display:flex;justify-content:center;align-items:center;font-weight:600}
    .box3{grid-column:4 / 5;grid-row:3 / 4}
    .box4{grid-column:2 / 3;grid-row:4 / 5}
    .box5{grid-column:3 / 4;grid-row:4 / 5}
    .box9{grid-column:4 / 5;grid-row:4 / 5}
    .box6{visibility:hidden}
    @media (max-width:800px){
        .container{grid-template-columns:1fr;grid-template-rows:auto;align-items:stretch}
        .sidebar{grid-row:auto;grid-column:1}
        .navbar{grid-column:1}
        .box1,.box2,.box7,.content,.box3,.box4,.box5,.box9{grid-column:1}
    }
    </style>
</head>
<body>
<div class="container">
    <div class="sidebar">Sidebar</div>
    <div class="navbar">Navigation</div>
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <!-- new box in 2nd row -->
    <div class="box box7">Box 7</div>
    <div class="content">Content</div>
    <div class="box box3">Box 3</div>
    <div class="box box4">Box 4</div>
    <div class="box box5">Box 5</div>
    <!-- new box in 4th row -->
    <div class="box box9">Box 9</div>
    <div class="box box6">Box 6</div>
</div>
</body>
</html>
